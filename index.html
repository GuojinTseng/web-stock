<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Stock - 实时A股行情</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --up-color: #ef4444;
            --up-bg: rgba(239, 68, 68, 0.1);
            --down-color: #22c55e;
            --down-bg: rgba(34, 197, 94, 0.1);
        }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at top right, #1e293b, transparent 40%),
                radial-gradient(circle at bottom left, #0f172a, transparent 40%);
            background-attachment: fixed;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        h1 {
            font-size: 2.25rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }
        .refresh-btn:hover { 
            background: var(--accent-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(59, 130, 246, 0.4);
        }
        .refresh-btn:active {
            transform: translateY(0);
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
        }
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stock-name-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .stock-name {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stock-code {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
        }
        .price-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 0.5rem;
        }
        .price {
            font-size: 1.875rem;
            font-weight: 700;
            line-height: 1;
        }
        .change-badge {
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.25rem 0.6rem;
            border-radius: 0.375rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .up { color: var(--up-color); }
        .down { color: var(--down-color); }
        .change-badge.up { background: var(--up-bg); }
        .change-badge.down { background: var(--down-bg); }
        
        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .btn-sm {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-secondary);
            padding: 0.4rem;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-sm:hover {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        .btn-ai {
            color: #d1d5db;
            background: linear-gradient(135deg, rgba(99,102,241,0.2) 0%, rgba(168,85,247,0.2) 100%);
            border-color: rgba(168,85,247,0.3);
        }
        .btn-ai:hover {
            background: linear-gradient(135deg, rgba(99,102,241,0.4) 0%, rgba(168,85,247,0.4) 100%);
            color: white;
            box-shadow: 0 0 10px rgba(168,85,247,0.3);
        }
        
        /* Add Stock Banner */
        .add-stock-banner {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            background: var(--panel-bg);
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .add-input {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .add-input:focus { border-color: var(--accent); }
        
        /* Modal for AI */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            margin: 0;
            font-size: 1.25rem;
            background: linear-gradient(to right, #a78bfa, #f472b6);
            -webkit-background-clip: text;
            color: transparent;
        }
        .modal-close {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1.5rem; cursor: pointer; line-height: 1;
        }
        .modal-close:hover { color: white; }
        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            color: #e2e8f0;
            line-height: 1.6;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .cursor-blink {
            display: inline-block;
            width: 8px; height: 16px;
            background: #a78bfa;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
            margin-left: 2px;
        }
        
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web Stock 行情概览 <span style="font-size:0.5em; color:var(--text-secondary);">v1.2 (AI & Proxy)</span></h1>
            <button class="refresh-btn" onclick="fetchData()">刷新数据</button>
        </header>

        <div class="add-stock-banner">
            <input type="text" id="newStockInput" class="add-input" placeholder="输入股票代码 (如 sh600519 或 sz000001)" onkeypress="if(event.key==='Enter') addStock()">
            <button class="refresh-btn" onclick="addStock()">+ 添加自选</button>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="loading">正在加载自选股...</div>
        </div>
    </div>

    <!-- AI Modal -->
    <div class="modal" id="aiModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="aiModalTitle">DeepSeek 行情诊断</h2>
                <button class="modal-close" onclick="closeAiModal()">&times;</button>
            </div>
            <div class="modal-body" id="aiModalBody">
            </div>
        </div>
    </div>

    <script>
        // Use local storage to persist user stocks
        const DEFAULT_STOCKS = ["sh600519", "sz000858", "sh601318", "sz002594", "sz000001", "sz000333"];
        let myStocks = [];

        function loadStocks() {
            const saved = localStorage.getItem('webStocks');
            if (saved) {
                try { myStocks = JSON.parse(saved); } catch(e){}
            }
            if (!myStocks || myStocks.length === 0) {
                myStocks = [...DEFAULT_STOCKS];
                saveStocks();
            }
        }

        function saveStocks() {
            localStorage.setItem('webStocks', JSON.stringify(myStocks));
        }

        function addStock() {
            const input = document.getElementById('newStockInput');
            let code = input.value.trim().toLowerCase();
            if (!code) return;
            // Simple validation
            if (!code.startsWith('sh') && !code.startsWith('sz')) {
                alert("请输入以 sh 或 sz 开头的完整股票代码，例如: sh600519");
                return;
            }
            if (myStocks.includes(code)) {
                alert("该自选股已存在");
                return;
            }
            myStocks.push(code);
            saveStocks();
            input.value = '';
            fetchData();
        }

        function removeStock(code) {
            myStocks = myStocks.filter(s => s !== code);
            saveStocks();
            fetchData();
        }

        async function fetchData() {
            loadStocks();
            const dashboard = document.getElementById('dashboard');
            
            if (myStocks.length === 0) {
                dashboard.innerHTML = '<div class="loading">暂无自选股，请在上方添加</div>';
                return;
            }

            try {
                const query = myStocks.join(',');
                const response = await fetch(`/api/market?symbols=${query}`);
                const data = await response.json();
                
                dashboard.innerHTML = '';
                
                data.forEach(item => {
                    const changePct = parseFloat(item['涨跌幅']);
                    const price = parseFloat(item['最新价']);
                    const name = item['名称'];
                    const symbol = item['代码'];
                    
                    const isUp = changePct >= 0;
                    const changeClass = isUp ? 'up' : 'down';
                    const changeSign = isUp ? '+' : '';
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="stock-header">
                            <div class="stock-name-group">
                                <div class="stock-name">${name}</div>
                                <div class="stock-code">${symbol.toUpperCase()}</div>
                            </div>
                            <div class="change-badge ${changeClass}">
                                ${changeSign}${changePct}%
                            </div>
                        </div>
                        <div class="price-section">
                            <div class="price ${changeClass}">${price.toFixed(2)}</div>
                        </div>
                        <div class="chart-container" style="height: 50px; margin-top: 10px;">
                            <svg class="chart" id="chart-${symbol}" viewBox="0 -5 100 50" style="width: 100%; height: 100%; overflow: visible;" preserveAspectRatio="none">
                            </svg>
                        </div>
                        <div class="card-actions">
                            <button class="btn-sm btn-ai" onclick="openAiModal('${symbol}', '${name}')">DeepSeek 诊断</button>
                            <button class="btn-sm" onclick="removeStock('${symbol}')">移除</button>
                        </div>
                    `;
                    dashboard.appendChild(card);

                    // Fetch and render the graph
                    renderSparkline(symbol, isUp);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                dashboard.innerHTML = '<div class="loading" style="color:var(--down-color);">数据加载失败，请检查后端运行状态。</div>';
            }
        }

        async function renderSparkline(symbol, isUp) {
            try {
                const res = await fetch(`/api/stock/${symbol}/intraday`);
                const json = await res.json();
                if (json.status !== 'success' || !json.data || json.data.length === 0) return;

                const prices = json.data;
                const minPrice = Math.min(...prices);
                const maxPrice = Math.max(...prices);
                const range = (maxPrice - minPrice) || 1; 

                // SVG Path Generation for viewBox="0 -5 100 50"
                const width = 100;
                const height = 40;
                
                const points = prices.map((val, i) => {
                    const x = (i / (prices.length - 1)) * width;
                    const y = height - ((val - minPrice) / range) * height;
                    return `${x},${y}`;
                }).join(' ');

                const svg = document.getElementById(`chart-${symbol}`);
                if (svg) {
                    const color = isUp ? 'var(--up-color)' : 'var(--down-color)';
                    const gradientId = `grad-${symbol}-${Math.random().toString(36).substr(2,9)}`;
                    svg.innerHTML = `
                        <defs>
                            <linearGradient id="${gradientId}" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="${color}" stop-opacity="0.2" />
                                <stop offset="100%" stop-color="${color}" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <polygon points="${points} ${width},${height} 0,${height}" fill="url(#${gradientId})" />
                    `;
                }

            } catch(e) {
                console.error("Chart error", e);
            }
        }

        /* AI Modal Logic */
        let currentAiStream = null;
        const modal = document.getElementById('aiModal');
        const modalTitle = document.getElementById('aiModalTitle');
        const modalBody = document.getElementById('aiModalBody');

        window.onclick = function(event) {
            if (event.target == modal) closeAiModal();
        }

        function openAiModal(symbol, name) {
            symbol = symbol.toLowerCase();
            modalTitle.textContent = `${name} (${symbol.toUpperCase()}) - DeepSeek 诊断`;
            modalBody.innerHTML = `正在呼叫 AI 分析行情与微观盘口数据...<span class="cursor-blink"></span>`;
            modal.classList.add('active');

            if (currentAiStream) {
                currentAiStream.close();
            }

            // SSE Request
            currentAiStream = new EventSource(`/api/stock/${symbol}/analyze`);
            let accumulatedText = "";

            currentAiStream.onmessage = function(event) {
                const textChunk = event.data.replace(/\\n/g, '\n'); 
                accumulatedText += textChunk;
                // Simple markdown parsing to make **bold** work
                const formattedHtml = accumulatedText.replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1</strong>');
                modalBody.innerHTML = formattedHtml + '<span class="cursor-blink"></span>';
                modalBody.scrollTop = modalBody.scrollHeight;
            };

            currentAiStream.onerror = function(err) {
                currentAiStream.close();
                currentAiStream = null;
                modalBody.innerHTML = accumulatedText + '\n\n<span style="color:var(--down-color);">连接结束。</span>';
            };
        }

        function closeAiModal() {
            modal.classList.remove('active');
            if (currentAiStream) {
                currentAiStream.close();
                currentAiStream = null;
            }
        }

        // Initialize
        loadStocks();
        fetchData();
        
        // Auto refresh
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
