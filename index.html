<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Stock - 实时A股行情</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --up-color: #ef4444;
            --up-bg: rgba(239, 68, 68, 0.1);
            --down-color: #22c55e;
            --down-bg: rgba(34, 197, 94, 0.1);
        }
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at top right, #1e293b, transparent 40%),
                radial-gradient(circle at bottom left, #0f172a, transparent 40%);
            background-attachment: fixed;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        h1 {
            font-size: 2.25rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }
        .refresh-btn:hover { 
            background: var(--accent-hover); 
            transform: translateY(-1px);
            box-shadow: 0 6px 8px -1px rgba(59, 130, 246, 0.4);
        }
        .refresh-btn:active {
            transform: translateY(0);
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.1);
        }
        .stock-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stock-name {
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .stock-code {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
        }
        .price-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 0.5rem;
        }
        .price {
            font-size: 1.875rem;
            font-weight: 700;
            line-height: 1;
        }
        .change-badge {
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.25rem 0.6rem;
            border-radius: 0.375rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .up { 
            color: var(--up-color); 
        }
        .down { 
            color: var(--down-color); 
        }
        .change-badge.up {
            background: var(--up-bg);
        }
        .change-badge.down {
            background: var(--down-bg);
        }
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-size: 1.1rem;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Web Stock 行情概览</h1>
            <button class="refresh-btn" onclick="fetchData()">刷新数据</button>
        </header>
        <div class="dashboard" id="dashboard">
            <div class="loading">正在获取沪深 A 股实时行情，请稍候...</div>
        </div>
    </div>

    <script>
        async function fetchData() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '<div class="loading">刷新中...</div>';
            try {
                const res = await fetch('/api/market');
                const json = await res.json();
                if (json.status === 'success') {
                    renderData(json.data);
                } else {
                    dashboard.innerHTML = `<div style="color: var(--up-color); grid-column: 1/-1;">获取数据失败: ${json.message}</div>`;
                }
            } catch (e) {
                dashboard.innerHTML = `<div style="color: var(--up-color); grid-column: 1/-1;">网络请求错误: ${e.message}</div>`;
            }
        }

        function renderData(data) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';
            
            data.forEach(stock => {
                const changePct = stock['涨跌幅'];
                const price = stock['最新价'];
                const isUp = changePct >= 0;
                const changeClass = isUp ? 'up' : 'down';
                const sign = isUp ? '+' : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="stock-header">
                        <div class="stock-name">${stock['名称']}</div>
                        <div class="stock-code">${stock['代码']}</div>
                    </div>
                    <div class="price-section">
                        <span class="price ${changeClass}">${price === '-' ? '-' : Number(price).toFixed(2)}</span>
                        <span class="change-badge ${changeClass}">${sign}${changePct === '-' ? '-' : changePct + '%'}</span>
                    </div>
                `;
                dashboard.appendChild(card);
            });
        }

        // 初始化加载
        fetchData();
    </script>
</body>
</html>
